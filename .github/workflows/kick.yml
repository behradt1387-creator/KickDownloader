name: Download Kick Video to Filebin

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو یا کلیپ Kick'
        required: true
        type: string
      max_resolution:
        description: 'حداکثر کیفیت (پیشنهاد برای استریم طولانی: 720 یا 480)'
        required: false
        default: '720'
        type: string

jobs:
  # قسمت اول: دانلود ویدیو و ذخیره امن در گیت‌هاب
  download-video:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install -U "yt-dlp[default,curl-cffi]"

      - name: Download video from Kick
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          MAX_RES: ${{ inputs.max_resolution }}
        run: |
          mkdir -p downloads
          if [ -n "$MAX_RES" ]; then
            FORMAT="bestvideo[height<=${MAX_RES}]+bestaudio/best[height<=${MAX_RES}]/best"
          else
            FORMAT="bestvideo+bestaudio/best"
          fi

          yt-dlp \
            --impersonate chrome \
            --restrict-filenames \
            --merge-output-format mp4 \
            -f "$FORMAT" \
            -o "downloads/%(title).80s.%(ext)s" \
            "$VIDEO_URL"

      - name: Save video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kick-video
          path: downloads/*
          retention-days: 3

  # قسمت دوم: آپلود استریمی به Filebin بدون اشغال RAM
  upload-to-filebin:
    needs: download-video
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Retrieve video from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kick-video
          path: downloads

      - name: Upload to Filebin (parhamkick)
        run: |
          FILE_PATH=$(ls downloads/* | head -n 1)
          FILE_NAME=$(basename "$FILE_PATH")

          curl -f -X POST \
            -H "Content-Type: application/octet-stream" \
            -T "${FILE_PATH}" \
            "https://filebin.net/parhamkick/${FILE_NAME}"

          echo "### آپلود انجام شد" >> $GITHUB_STEP_SUMMARY
          echo "- **نام فایل:** \`${FILE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **پوشه Filebin:** https://filebin.net/parhamkick" >> $GITHUB_STEP_SUMMARY
          echo "- **لینک مستقیم فایل:** https://filebin.net/parhamkick/${FILE_NAME}" >> $GITHUB_STEP_SUMMARY
